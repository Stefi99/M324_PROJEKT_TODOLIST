name: Build Frontend and Backend

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: stefi99

jobs:
  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Frontend
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/todo-frontend:latest ./frontend

      - name: Push Frontend Image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/todo-frontend:latest

  frontend-test:
    name: Test React Frontend
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run Jest tests
        working-directory: frontend
        run: npm test -- --runInBand --watchAll=false

  backend-build:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend with Maven
        working-directory: backend
        run: mvn clean package

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Backend
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/todo-backend:latest ./backend

      - name: Push Backend Image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/todo-backend:latest

  backend-test:
    name: Test Spring Boot Backend
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run JUnit tests
        working-directory: backend
        run: mvn test
